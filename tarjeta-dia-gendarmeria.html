<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>88.º Aniversario – Gendarmería Nacional Argentina</title>

  <!-- OPEN GRAPH -->
  <meta property="og:title" content="88.º Aniversario – Gendarmería Nacional Argentina">
  <meta property="og:description" content="Saludo institucional por el Día de la Gendarmería Nacional Argentina.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Insignia_de_la_Gendarmer%C3%ADa_de_Argentina.svg/1280px-Insignia_de_la_Gendarmer%C3%ADa_de_Argentina.svg.png">
  <meta property="og:site_name" content="Sección Gualeguay – Gendarmería Nacional Argentina">

  <!-- TWITTER -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="88.º Aniversario – Gendarmería Nacional Argentina">
  <meta name="twitter:description" content="Saludo institucional por el Día de la Gendarmería Nacional Argentina.">
  <meta name="twitter:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Insignia_de_la_Gendarmer%C3%ADa_de_Argentina.svg/1280px-Insignia_de_la_Gendarmer%C3%ADa_de_Argentina.svg.png">

  <meta name="theme-color" content="#103b2d">
  <meta name="apple-mobile-web-app-title" content="Día de la Gendarmería">
  <meta name="format-detection" content="telephone=no">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --green-dark: #0a241c;
      --green-main: #103b2d;
      --green-soft: #1a5a45;
      --gold: #d4af37;
      --gold-soft: #f3df93;
      --text: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Source Sans 3', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(212, 175, 55, 0.18), transparent 28%),
        linear-gradient(145deg, var(--green-dark), var(--green-main), var(--green-soft));
      overflow-x: hidden;
      position: relative;
    }

    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 20%, rgba(212,175,55,0.10), transparent 18%),
        radial-gradient(circle at 85% 15%, rgba(255,255,255,0.08), transparent 14%),
        radial-gradient(circle at 50% 80%, rgba(212,175,55,0.08), transparent 20%);
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 14px;
    }

    .card {
      width: 100%;
      max-width: 860px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(212,175,55,0.28);
      border-radius: 26px;
      padding: 24px 22px 26px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.30);
      backdrop-filter: blur(8px);
      text-align: center;
    }

    .logo {
      width: 102px;
      max-width: 45vw;
      display: block;
      margin: 0 auto 10px;
      filter: drop-shadow(0 0 14px rgba(212,175,55,0.28));
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 13px;
      border-radius: 999px;
      border: 1px solid rgba(212,175,55,0.45);
      background: rgba(212,175,55,0.12);
      color: var(--gold-soft);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      line-height: 1.1;
      color: #fff;
      text-shadow: 0 0 16px rgba(212,175,55,0.22);
    }

    .subtitulo {
      margin: 6px 0 8px;
      font-size: 18px;
      font-weight: 600;
      color: var(--gold);
    }

    .destinatario {
      margin: 10px auto 14px;
      max-width: 720px;
      font-size: 15px;
      color: rgba(255,255,255,0.92);
    }

    .mensaje {
      max-width: 720px;
      margin: 0 auto;
      font-size: 15px;
      line-height: 1.55;
      color: rgba(255,255,255,0.94);
    }

    .frase {
      margin: 16px auto 0;
      max-width: 700px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: var(--gold-soft);
      line-height: 1.4;
    }

    .firma {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(212,175,55,0.25);
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      line-height: 1.7;
      color: var(--gold);
    }

    .firma small {
      display: inline-block;
      margin-top: 2px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 12px;
      color: #e9ddb0;
      line-height: 1.4;
    }

    .footer-note {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.72);
      letter-spacing: 0.3px;
    }



    .sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .sparkles span {
      position: absolute;
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(243, 223, 147, 0.75);
      box-shadow: 0 0 10px rgba(243, 223, 147, 0.35);
      animation: sparkleFloat 9s linear infinite, sparkleTwinkle 2.8s ease-in-out infinite;
    }

    .card {
      animation: cardFade .9s ease-out both;
    }

    .logo {
      animation: logoFloat 3.8s ease-in-out infinite, fadeUp .8s ease-out .15s both;
    }

    .badge {
      animation: fadeUp .75s ease-out .25s both, badgeGlow 2.8s ease-in-out infinite;
    }

    h1 { animation: fadeUp .75s ease-out .35s both; }
    .subtitulo { animation: fadeUp .75s ease-out .45s both; }
    .destinatario { animation: fadeUp .75s ease-out .55s both; }
    .mensaje { animation: fadeUp .75s ease-out .65s both; }
    .frase { animation: fadeUp .75s ease-out .8s both; }
    .firma { animation: fadeUp .75s ease-out .95s both; }
    .footer-note { animation: fadeUp .75s ease-out 1.05s both; }

    @keyframes cardFade {
      from { opacity: 0; transform: translateY(10px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes badgeGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(212,175,55,0); }
      50% { box-shadow: 0 0 18px rgba(212,175,55,0.14); }
    }

    @keyframes sparkleFloat {
      0% { transform: translateY(0) scale(.9); opacity: 0; }
      10% { opacity: .9; }
      90% { opacity: .6; }
      100% { transform: translateY(-110vh) scale(1.25); opacity: 0; }
    }

    @keyframes sparkleTwinkle {
      0%, 100% { opacity: .25; }
      50% { opacity: .95; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .logo, .badge, h1, .subtitulo, .destinatario, .mensaje, .frase, .firma, .footer-note, .sparkles span {
        animation: none !important;
      }
    }

    @media (max-width: 700px) {
      .card {
        padding: 22px 16px 24px;
        border-radius: 20px;
      }

      h1 {
        font-size: 31px;
      }

      .subtitulo {
        font-size: 15px;
      }

      .destinatario,
      .mensaje {
        font-size: 15px;
      }

      .frase {
        font-size: 18px;
      }

      .firma {
        font-size: 15px;
      }
    }

    @media (max-width: 420px) {
      .wrapper {
        padding: 10px 8px;
      }

      .logo {
        width: 84px;
      }

      h1 {
        font-size: 26px;
      }

      .subtitulo {
        font-size: 15px;
      }

      .badge {
        font-size: 12px;
        padding: 6px 10px;
      }

      .destinatario,
      .mensaje {
        font-size: 15px;
        line-height: 1.5;
      }

      .frase {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="sparkles" aria-hidden="true">
    <span style="left: 8%; bottom: -5%; animation-delay: 0s; animation-duration: 10s;"></span>
    <span style="left: 16%; bottom: -12%; width: 4px; height: 4px; animation-delay: 1.1s; animation-duration: 8.5s;"></span>
    <span style="left: 27%; bottom: -8%; width: 5px; height: 5px; animation-delay: 2.3s; animation-duration: 9.5s;"></span>
    <span style="left: 39%; bottom: -15%; width: 7px; height: 7px; animation-delay: .7s; animation-duration: 11s;"></span>
    <span style="left: 51%; bottom: -10%; width: 4px; height: 4px; animation-delay: 1.8s; animation-duration: 8.8s;"></span>
    <span style="left: 63%; bottom: -7%; width: 6px; height: 6px; animation-delay: 2.8s; animation-duration: 10.5s;"></span>
    <span style="left: 72%; bottom: -14%; width: 5px; height: 5px; animation-delay: .3s; animation-duration: 9.2s;"></span>
    <span style="left: 81%; bottom: -9%; width: 4px; height: 4px; animation-delay: 2.1s; animation-duration: 8.7s;"></span>
    <span style="left: 89%; bottom: -13%; width: 6px; height: 6px; animation-delay: 1.4s; animation-duration: 10.8s;"></span>
  </div>

  <div class="wrapper">
    <section class="card">
      <img class="logo" src="imag/logo-512.png.jpg" alt="Escudo Gendarmería Nacional Argentina">

      <div class="badge">28 de julio · Día de la Gendarmería Nacional Argentina</div>

      <h1>88.º Aniversario</h1>
      <div class="subtitulo">Gendarmería Nacional Argentina</div>

      <p class="destinatario" id="destinatario"></p>

      <div class="mensaje" id="mensaje"></div>

      <div class="frase">
        “Honor, servicio y compromiso con la Patria.”
      </div>

      <div class="firma">
        Atentamente,<br>
        <b>JOSE MANUEL CARRIZO</b><br>
        <small>1.er Alférez<br>Jefe de la Sección Gualeguay</small>
      </div>

      <div class="footer-note">Sección “Gualeguay” · Gendarmería Nacional Argentina</div>
    </section>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const destinatario = document.getElementById('destinatario');
    const mensaje = document.getElementById('mensaje');

    const jerarquia = (params.get('jerarquia') || params.get('grado') || '').trim();
    const nombre = (params.get('nombre') || '').trim();
    const para = (params.get('para') || '').trim();

    const escapeHtml = (texto) => texto
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

    let destinatarioFinal = 'Al personal de la Sección Gualeguay';

    if (jerarquia && nombre) {
      destinatarioFinal = `${jerarquia} ${nombre}`;
    } else if (nombre) {
      destinatarioFinal = nombre;
    } else if (para) {
      destinatarioFinal = para;
    }

    destinatario.innerHTML = `<strong>${escapeHtml(destinatarioFinal)}</strong>`;

    const saludoPersonal = (jerarquia || nombre)
      ? `En este nuevo aniversario, hacemos llegar al <strong>${escapeHtml(destinatarioFinal)}</strong> nuestro reconocimiento por su vocación de servicio, compromiso y lealtad institucional.`
      : `En este nuevo aniversario, hacemos llegar nuestro reconocimiento a quienes integran la <strong>Gendarmería Nacional Argentina</strong> por su servicio, compromiso y entrega diaria.`;

    mensaje.innerHTML = `
      ${saludoPersonal}
      <br><br>
      Que esta fecha renueve el orgullo de pertenecer a la Fuerza y fortalezca el espíritu de cuerpo para continuar cumpliendo la misión con honor y responsabilidad.
    `;
  </script>
</body>
</html>
